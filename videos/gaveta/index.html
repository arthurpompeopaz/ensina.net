<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1d2a52; }
      #root { position: relative; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="27" data-width="1920" data-height="1080">
      <div id="horas" data-composition-id="horas" data-composition-src="compositions/horas.html"
        data-start="0" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="gaveta" data-composition-id="gaveta" data-composition-src="compositions/gaveta.html"
        data-start="4.2" data-duration="5.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="renda" data-composition-id="renda" data-composition-src="compositions/renda.html"
        data-start="9.6" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="venda" data-composition-id="venda" data-composition-src="compositions/venda.html"
        data-start="13.1" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="noventa" data-composition-id="noventa" data-composition-src="compositions/noventa.html"
        data-start="17.5" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="fim" data-composition-id="fim" data-composition-src="compositions/fim.html"
        data-start="21" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- Narração (Fernanda, ElevenLabs): coloque o arquivo em assets/narracao.mp3 e remova data-hidden.
      <audio id="narracao" class="clip" src="assets/narracao.mp3" data-start="0" data-track-index="3" data-volume="1"></audio>
      -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
